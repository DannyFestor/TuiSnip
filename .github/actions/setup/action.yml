name: Set up toolchain
description: Install the tools pinned in mise.toml and restore the Go caches.

inputs:
  cache-scope:
    description: Separates Go build caches of jobs that compile different targets or tags.
    default: ${{ github.job }}

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        version: 2026.9.18

    - id: go-env
      shell: bash
      run: |
        echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-env.outputs.gocache }}
          ${{ steps.go-env.outputs.gomodcache }}
        key: go-${{ runner.os }}-${{ inputs.cache-scope }}-${{ hashFiles('go.sum', 'mise.toml') }}
        restore-keys: go-${{ runner.os }}-${{ inputs.cache-scope }}-
