name: Weekly

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make test-fuzz FUZZTIME=5m
      # A human commits each crasher as a regression seed.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/"
          if-no-files-found: ignore

  property-deep:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make test-property-deep
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapid-failures
          path: "**/testdata/rapid/"
          if-no-files-found: ignore

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: |
          echo "MON nproc=$(nproc)"; free -m; df -h /
          gocache="$(go env GOCACHE)"
          (while true; do
            echo "MON $(date +%T) mem_used=$(free -m | awk '/Mem/{print $3}')MB avail=$(free -m | awk '/Mem/{print $7}')MB swap=$(free -m | awk '/Swap/{print $3}')MB disk_free=$(df -m / | awk 'NR==2{print $4}')MB gocache=$(du -sm "$gocache" 2>/dev/null | cut -f1)MB tmp=$(sudo du -sm /tmp 2>/dev/null | cut -f1)MB tests=$(pgrep -c -f '\.test') top=$(ps -eo rss=,comm= --sort=-rss | head -4 | awk '{printf "%s:%dMB,", $2, $1/1024}')"
            sleep 30
          done) &
          sudo dmesg -w --level=emerg,alert,crit,err,warn | sed 's/^/DMESG /' &
          systemd --version | head -1
          systemd-run --user --scope --quiet -p MemoryMax=1G true && echo "MON user scope works" || echo "MON user scope fails"
          sudo systemd-run --scope --quiet --uid="$(id -u)" --gid="$(id -g)" -p MemoryMax=1G true && echo "MON sudo scope works" || echo "MON sudo scope fails"
          sudo --preserve-env env "PATH=$PATH" systemd-run --scope --quiet --uid="$(id -u)" --gid="$(id -g)" \
            -p MemoryMax=12G -p MemorySwapMax=0 -p OOMPolicy=continue make test-mutation
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: mutation-report.json
